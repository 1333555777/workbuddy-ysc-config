name: Auto Update TVBox Configs

on:
  schedule:
    # 每天 02:00 和 14:00 UTC（北京时间 10:00 / 22:00）各跑一次
    - cron: "0 2,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run aggregator
        env:
          REPO: ${{ github.repository }}
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动更新影视仓配置 $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Push
        run: git push

      - name: Purge jsDelivr CDN cache
        run: |
          # raw / jsDelivr 都有缓存，push 后等 5 分钟再 purge，避免回源取到旧内容
          sleep 300
          for f in subscribe.json all.json status.json shield.json; do
            echo "purge $f"
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/output/$f"
            echo
          done
